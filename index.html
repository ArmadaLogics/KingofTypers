<section id="loading-screen" aria-label="Loading game">
  <canvas class="loading-paper" aria-hidden="true" width="0" height="0"></canvas>
  <div class="loading-edge loading-edge-top" aria-hidden="true"></div>
  <main class="loading-content">
    <div class="loading-emblem" aria-hidden="true">
      <div class="loading-pawn"></div>
    </div>
    <div class="loading-progress-block">
      <div class="loading-track" role="progressbar" aria-label="Loading game art" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="loading-bar-center"><div class="loading-fill"></div></div>
      </div>
      <p id="loading-status" role="status">Loading...</p>
    </div>
  </main>
  <div class="loading-edge loading-edge-bottom" aria-hidden="true"></div>
</section>
<div id="wrap"><canvas id="c" width="960" height="576" tabindex="-1"></canvas></div>
<dialog id="chapter-selection" aria-labelledby="chapter-selection-heading">
  <div class="kw-shell">
    <section class="kw-game">
      <header class="kw-heading">
        <button class="kw-main-menu" type="button" aria-label="Main menu" aria-keyshortcuts="Escape">
          <span class="kw-back-plate" aria-hidden="true"><span class="kw-back-arrow"></span></span>
        </button>
        <div class="kw-wordmark">KEYWARD</div>
        <h2 id="chapter-selection-heading">Choose a chapter</h2>
        <div class="kw-divider" aria-hidden="true"><span></span></div>
      </header>
      <div class="kw-gallery" role="group" aria-label="Chapter cards"></div>
      <div class="kw-navigation" role="group" aria-label="Browse chapters">
        <button class="kw-arrow" data-direction="-1" type="button" aria-label="Previous chapter">‹</button>
        <span class="kw-index" aria-hidden="true"></span>
        <button class="kw-arrow" data-direction="1" type="button" aria-label="Next chapter">›</button>
      </div>
      <div class="kw-action">
        <div class="kw-caption" aria-live="polite"></div>
        <button class="kw-enter" type="button">Enter chapter <span aria-hidden="true">→</span></button>
      </div>
      <p class="kw-star-rules">Earn a star for clearing a stage, another at 90% accuracy, and another for finishing with at least half your Ward.</p>
    </section>
  </div>
</dialog>
